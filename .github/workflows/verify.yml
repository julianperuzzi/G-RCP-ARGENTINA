name: Verificar portal y mapa DEA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:portal
      - run: npm run test:dea
      - run: npm run test:rcp
      - run: npm run test:shop
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
